# The dashboard stack: a single container running the gateway (control plane +
# reverse proxy) and the Next.js UI together, behind one published port (:8080).
# The only other containers are the agents the gateway spawns at runtime.
#
# Works on Linux and macOS: the gateway runs in a container here, and
# container-to-container traffic over swarm-net resolves by name on both (only
# host-to-container DNS is blocked on Docker Desktop, which is why host-run dev
# uses ports mode instead — see README → Running the stack).
#
# Spawned agents are tagged with this project (agent-swarm) so Portainer and
# other Docker UIs nest them under this stack.
name: agent-swarm

# swarm-net is shared between this stack and the agents the gateway spawns at
# runtime, so it's external (create once: `docker network create swarm-net`).
networks:
  swarm-net:
    name: swarm-net
    external: true

volumes:
  # Persists control-plane state across restarts: the Claude OAuth token, plus
  # roles/groups/group-chat logs and cpu/mem history (all JSON under /data).
  gateway-data:

services:
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      GATEWAY_MODE: network
      SWARM_NETWORK: swarm-net
      # Nest spawned agents under this stack in Docker UIs.
      SWARM_PROJECT: agent-swarm
      AGENT_IMAGE: agent-swarm/agent:dev
      DOCKER_SOCKET: /var/run/docker.sock
      # Claude Code OAuth token (`claude setup-token` on the host). Injected into
      # each agent as CLAUDE_CODE_OAUTH_TOKEN so it bills to your subscription.
      # Set it in .env / the shell, or leave blank and paste it in the dashboard
      # Settings page (persisted in the gateway-data volume).
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      # Pass the host GPU (/dev/dri) into agents for hardware-accelerated graphics
      # (set AGENT_GPU=1 on a host with a GPU; agents fall back to software if the
      # device is missing). AGENT_SHM_MB sizes the agents' /dev/shm (Chrome needs
      # more than the 64MB default or it crashes).
      AGENT_GPU: ${AGENT_GPU:-}
      AGENT_SHM_MB: ${AGENT_SHM_MB:-512}
      # Container runtime for agents. Set AGENT_RUNTIME=sysbox-runc on a Linux
      # host with Sysbox installed (https://github.com/nestybox/sysbox) to run the
      # agents' systemd/GNOME desktop UNPRIVILEGED in a user namespace — the
      # gateway then drops SYS_ADMIN + the unconfined seccomp/apparmor profiles +
      # cgroupns=host. Leave blank for the default runc (needed on macOS dev,
      # where Sysbox isn't available — there the privileged flags are kept).
      AGENT_RUNTIME: ${AGENT_RUNTIME:-}
      # Set TRUST_PROXY=1 when (and only when) a trusted reverse proxy fronts
      # the gateway and sets X-Forwarded-* / X-Real-IP / CF-Connecting-IP. The
      # gateway then uses those for the login rate-limit key and marks the
      # session cookie Secure behind HTTPS. Leave blank when clients can reach
      # this port directly — the headers are client-forgeable.
      TRUST_PROXY: ${TRUST_PROXY:-}
      # Persistent agent disks. SWARM_DATA_HOST is a HOST path (the daemon
      # resolves it when bind-mounting each agent's home); SWARM_DATA_MOUNT is
      # where this container sees that same tree (the volume below) so the
      # gateway can seed/package/delete it directly.
      SWARM_DATA_HOST: ${PWD}/.swarm_data
      SWARM_DATA_MOUNT: /swarmdata
    ports:
      # Host port is configurable (DASHBOARD_PORT) for hosts where 8080 is taken;
      # the gateway still listens on 8080 inside the container.
      - '${DASHBOARD_PORT:-8080}:8080'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - gateway-data:/data
      # rslave: host mounts that appear UNDER .swarm_data after this container
      # starts (the shared-volume loop mounts at volumes/<name>) propagate in,
      # so the gateway can statfs them for usage reporting.
      - type: bind
        source: ${PWD}/.swarm_data
        target: /swarmdata
        bind:
          propagation: rslave
    networks: [swarm-net]
    restart: unless-stopped
