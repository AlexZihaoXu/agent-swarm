# The dashboard stack: one published port (gateway :8080) fronting the
# dashboard and reverse-proxying to agent containers by name over swarm-net.
#
# Works on Linux and macOS: the gateway runs in a container here, and
# container-to-container traffic over swarm-net resolves by name on both (only
# host-to-container DNS is blocked on Docker Desktop, which is why host-run dev
# uses ports mode instead — see README → Running the stack).
#
# Spawned agents are tagged with this project (agent-swarm) so Portainer and
# other Docker UIs nest them under this stack.
name: agent-swarm

# swarm-net is shared between this stack and the agents the gateway spawns at
# runtime, so it's external (create once: `docker network create swarm-net`).
networks:
  swarm-net:
    name: swarm-net
    external: true

services:
  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
    # Empty => the dashboard's client calls the gateway same-origin (relative).
    environment:
      NEXT_PUBLIC_GATEWAY_URL: ''
    networks: [swarm-net]
    restart: unless-stopped

  gateway:
    build:
      context: .
      dockerfile: apps/gateway/Dockerfile
    environment:
      GATEWAY_MODE: network
      SWARM_NETWORK: swarm-net
      # Nest spawned agents under this stack in Docker UIs.
      SWARM_PROJECT: agent-swarm
      AGENT_IMAGE: agent-swarm/agent:dev
      DASHBOARD_UPSTREAM: http://dashboard:3000
      DOCKER_SOCKET: /var/run/docker.sock
      # IMPORTANT: a HOST path. The gateway only forwards this string to the
      # Docker daemon as an agent bind mount — the daemon resolves it on the
      # host, not inside this container. So we do NOT mount it here.
      CLAUDE_CREDENTIALS_FILE: ${CLAUDE_CREDENTIALS_FILE:-/root/.agent-swarm/.credentials.json}
    ports:
      - '8080:8080'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks: [swarm-net]
    depends_on: [dashboard]
    restart: unless-stopped
